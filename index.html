<!DOCTYPE html>\n
<html>\n
<head>\n
  <title>My Profile Card</title>\n
  <style>\n
    body { background-color: #f0f4f8; font-family: Arial; text-align: center; padding-top: 60px; }\n
    .card { background-color: white; width: 280px; margin: auto; padding: 20px; border-radius: 10px; }\n
    h2 { color: #222; margin-bottom: 5px; }\n
    p { color: #555; font-size: 14px; }\n
    a { display: inline-block; margin-top: 10px; padding: 8px 16px; background-color: blue; color: white; text-decoration: none; border-radius: 5px; }\n
  </style>\n
</head>\n
<body>\n
  <div class="card">\n
    <h2>Riya Sharma</h2>\n
    <p>Computer Science Student</p>\n
    <p>Learning web development and GitHub.</p>\n
    <a href="#">Contact</a>\n
  </div>\n
</body>\n
</html>
